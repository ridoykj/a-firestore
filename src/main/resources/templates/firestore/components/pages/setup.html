<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="setupPage" class="grid grid-cols-1 gap-3 xl:grid-cols-2">
    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Firestore Initialization</h2>
        <form hx-post="/ui/firestore/actions/init" hx-target="#setup-status" hx-swap="innerHTML" class="grid gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Project ID</span>
                <input class="compact-input" name="projectId" placeholder="my-gcp-project" required>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Database ID</span>
                <input class="compact-input" name="databaseId" placeholder="(default)">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Service Account JSON</span>
                <textarea class="compact-input min-h-[120px] py-2 font-code text-[13px] leading-[18px]" name="serviceAccountJson" placeholder='{"type":"service_account", ...}' required></textarea>
            </label>
            <button class="compact-btn bg-primary text-on-primary hover:bg-primary/90" type="submit">Initialize Firestore</button>
        </form>
        <div id="setup-status" class="mt-3 grid gap-2"></div>
    </article>

    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Discover Accessible Projects</h2>
        <form hx-post="/ui/firestore/actions/projects" hx-target="#projects-result" hx-swap="innerHTML" class="grid gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Service Account JSON</span>
                <textarea class="compact-input min-h-[120px] py-2 font-code text-[13px] leading-[18px]" name="serviceAccountJson" placeholder='{"type":"service_account", ...}' required></textarea>
            </label>
            <button class="compact-btn bg-primary text-on-primary hover:bg-primary/90" type="submit">List Projects</button>
        </form>
        <div id="projects-result" class="mt-3 grid gap-2"></div>
    </article>
</section>
</body>
</html>
