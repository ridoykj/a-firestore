<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="explorerPage" class="grid grid-cols-1 gap-3 xl:grid-cols-2">
    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Metadata</h2>
        <div class="mb-3 flex flex-wrap gap-2">
            <button class="compact-btn border border-outline-variant bg-surface-container-lowest text-secondary hover:bg-surface-container-low" hx-get="/ui/firestore/fragments/databases" hx-target="#metadata-result" hx-swap="innerHTML">Load Databases</button>
            <button class="compact-btn border border-outline-variant bg-surface-container-lowest text-secondary hover:bg-surface-container-low" hx-get="/ui/firestore/fragments/collections" hx-target="#metadata-result" hx-swap="innerHTML">Load Root Collections</button>
        </div>
        <div id="metadata-result" class="grid gap-2"></div>
    </article>

    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Path Explorer</h2>
        <form hx-get="/ui/firestore/fragments/explore" hx-target="#explorer-result" hx-swap="innerHTML" class="grid gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Firestore Path</span>
                <input class="compact-input font-code text-[13px] leading-[18px]" name="path" placeholder="users or users/user_123/orders" required>
            </label>
            <button class="compact-btn bg-primary text-on-primary hover:bg-primary/90" type="submit">Explore</button>
        </form>
        <div id="explorer-result" class="mt-3 grid gap-2"></div>
    </article>
</section>
</body>
</html>
