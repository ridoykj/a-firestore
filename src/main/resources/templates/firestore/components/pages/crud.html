<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="crudPage" class="grid grid-cols-1 gap-3 xl:grid-cols-2">
    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Create Document</h2>
        <form hx-post="/ui/firestore/actions/create" hx-target="#crud-result" hx-swap="innerHTML" class="grid gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Collection Path</span>
                <input class="compact-input font-code text-[13px] leading-[18px]" name="collectionPath" placeholder="users" required>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">JSON Payload</span>
                <textarea class="compact-input min-h-[110px] py-2 font-code text-[13px] leading-[18px]" name="payloadJson" placeholder='{"name":"Ada"}'></textarea>
            </label>
            <button class="compact-btn bg-primary text-on-primary hover:bg-primary/90" type="submit">Create</button>
        </form>
    </article>

    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Update Document (Merge)</h2>
        <form hx-post="/ui/firestore/actions/update" hx-target="#crud-result" hx-swap="innerHTML" class="grid gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Document Path</span>
                <input class="compact-input font-code text-[13px] leading-[18px]" name="documentPath" placeholder="users/user_123" required>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">JSON Payload</span>
                <textarea class="compact-input min-h-[110px] py-2 font-code text-[13px] leading-[18px]" name="payloadJson" placeholder='{"city":"Dhaka"}'></textarea>
            </label>
            <button class="compact-btn bg-primary text-on-primary hover:bg-primary/90" type="submit">Update</button>
        </form>
    </article>

    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Delete Document</h2>
        <form hx-post="/ui/firestore/actions/delete" hx-target="#crud-result" hx-swap="innerHTML" class="grid gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-[11px] font-semibold uppercase tracking-[0.05em] text-secondary">Document Path</span>
                <input class="compact-input font-code text-[13px] leading-[18px]" name="documentPath" placeholder="users/user_123" required>
            </label>
            <button class="compact-btn bg-error text-on-error hover:bg-error/90" type="submit">Delete</button>
        </form>
    </article>

    <article class="panel-card">
        <h2 class="mb-3 text-[18px] font-semibold leading-6 text-on-surface">Action Result</h2>
        <div id="crud-result" class="grid gap-2"></div>
    </article>
</section>
</body>
</html>
