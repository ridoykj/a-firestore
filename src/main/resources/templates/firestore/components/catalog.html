<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="projects" class="grid gap-2">
    <h3 class="text-[18px] font-semibold leading-6 text-on-surface">Projects</h3>
    <div class="overflow-auto rounded border border-outline-variant"
         th:if="${projects != null and !#lists.isEmpty(projects)}">
        <table class="dense-table w-full min-w-[320px] border-collapse text-left font-code text-[13px] leading-[18px]">
            <thead>
            <tr>
                <th class="text-secondary">Project ID</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="project : ${projects}"
                class="odd:bg-surface-container-lowest even:bg-surface-bright hover:bg-blue-50/50">
                <td class="break-all text-on-surface" th:text="${project}">project-id</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-[14px] leading-5 text-on-surface-variant" th:if="${projects == null or #lists.isEmpty(projects)}">No
        projects found.</p>
</div>

<div th:fragment="databases" class="grid gap-2">
    <h3 class="text-[18px] font-semibold leading-6 text-on-surface">Databases</h3>
    <div class="overflow-auto rounded border border-outline-variant"
         th:if="${databases != null and !#lists.isEmpty(databases)}">
        <table class="dense-table w-full min-w-[320px] border-collapse text-left font-code text-[13px] leading-[18px]">
            <thead>
            <tr>
                <th class="text-secondary">Database ID</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="database : ${databases}"
                class="odd:bg-surface-container-lowest even:bg-surface-bright hover:bg-blue-50/50">
                <td class="break-all text-on-surface" th:text="${database}">database-id</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-[14px] leading-5 text-on-surface-variant" th:if="${databases == null or #lists.isEmpty(databases)}">
        No databases found.</p>
</div>

<div th:fragment="collections" class="grid gap-2">
    <h3 class="text-[18px] font-semibold leading-6 text-on-surface">Root Collections</h3>
    <div class="overflow-auto rounded border border-outline-variant"
         th:if="${collections != null and !#lists.isEmpty(collections)}">
        <table class="dense-table w-full min-w-[320px] border-collapse text-left font-code text-[13px] leading-[18px]">
            <thead>
            <tr>
                <th class="text-secondary">Collection</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="collection : ${collections}"
                class="odd:bg-surface-container-lowest even:bg-surface-bright hover:bg-blue-50/50">
                <td class="break-all text-on-surface" th:text="${collection}">collection</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-[14px] leading-5 text-on-surface-variant"
       th:if="${collections == null or #lists.isEmpty(collections)}">No collections found.</p>
</div>
</body>
</html>
